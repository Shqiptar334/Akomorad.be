
backend:
  name: github
  repo: Shqiptar334/Akomorad.be
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "posts"
    create: true
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "rechtszaken"
    label: "Rechtszaken"
    files:
      - name: "rechtszaken"
        file: "rechtszaken.html"
        label: "Rechtszaken Pagina"
        fields:
          - { label: "Inhoud", name: "body", widget: "markdown" }

  - name: "rollen"
    label: "Rollen"
    files:
      - name: "rollen"
        file: "rollen.html"
        label: "Rollen Pagina"
        fields:
          - { label: "Inhoud", name: "body", widget: "markdown" }

  - name: "IDkaarten"
    label: "ID Kaarten"
    files:
      - name: "IDkaarten"
        file: "IDkaarten.html"
        label: "ID Kaarten Pagina"
        fields:
          - { label: "Inhoud", name: "body", widget: "markdown" }

  - name: "video"
    label: "Video"
    files:
      - name: "video"
        file: "video.html"
        label: "Video Pagina"
        fields:
          - { label: "Inhoud", name: "body", widget: "markdown" }
