<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akomorad | Video</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    :root{
      --bg:#0a0a0a;
      --panel:#141414;
      --text:#ffffff;
      --muted:#d2d2d2;
      --red:#c8102e;
      --line:rgba(255,255,255,.10);
      --shadow:0 18px 40px rgba(0,0,0,.35);
      --max:1000px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(200,16,46,.18), transparent 24%),
        linear-gradient(180deg,#060606 0%,#0e0e0e 100%);
      color:var(--text);
    }
    a{text-decoration:none;color:inherit}
    .topbar{
      position:sticky;top:0;z-index:1000;
      background:rgba(10,10,10,.9);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{
      width:min(var(--max), calc(100% - 32px));
      margin:0 auto;
      min-height:76px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:16px;
      padding:10px 0;
    }
    .brand{display:flex;align-items:center;gap:14px}
    .brand img{width:50px;height:50px;object-fit:contain;border-radius:14px;background:#fff;padding:5px}
    .brand-text strong{display:block;letter-spacing:.16em;text-transform:uppercase}
    .brand-text span{display:block;color:#f3c5cd;font-size:.9rem}
    .nav{display:flex;gap:10px;flex-wrap:wrap}
    .nav a{padding:10px 14px;border-radius:999px;font-weight:700;transition:.2s ease}
    .nav a:hover,.nav a.active{background:var(--red)}
    .container{
      width:min(var(--max), calc(100% - 32px));
      margin:0 auto;
      padding:36px 0 40px;
    }
    .hero{
      text-align:center;
      margin-bottom:22px;
    }
    .hero h1{
      margin:0 0 10px;
      font-size:clamp(2rem,5vw,3.4rem);
    }
    .hero p{
      margin:0 auto;
      color:var(--muted);
      max-width:720px;
    }
    .video-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:24px;
      padding:20px;
      box-shadow:var(--shadow);
    }
    video{
      width:100%;
      display:block;
      border-radius:16px;
      background:#000;
    }
    .note{
      margin-top:14px;
      color:#d5d5d5;
      text-align:center;
      font-size:.95rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <img src="akomorada-logo.png" alt="Akomorad logo">
        <div class="brand-text">
          <strong>AKOMORAD</strong>
          <span>Eén familie. Eén woord. Eén hartslag.</span>
        </div>
      </a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="rollen.html">Rollen</a>
        <a href="IDkaarten.html">ID-Kaarten</a>
        <a href="rechtszaken.html">Rechtszaken</a>
        <a href="video.html" class="active">Video</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>🎥 Akomorad Video</h1>
      <p>
       
      </p>
    </section>

    <section class="video-card">
      <video controls preload="metadata">
        <source src="mijnvideo.mp4" type="video/mp4" />
        Je browser ondersteunt deze video niet.
      </video>
      <div class="note">
        Zorg dat <strong>mijnvideo.mp4</strong> in dezelfde map staat als deze pagina.
      </div>
    </section>
  </main>
</body>
</html>
